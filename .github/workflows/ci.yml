name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Only-CI-Disposable-2026!
        ports: ['1433:1433']
    env:
      SQL_TEST_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=PuntoStock_qa_00000000000000000000000000000001;encrypt=true;trustServerCertificate=true
      SQL_BASELINE_URL: jdbc:sqlserver://127.0.0.1:1433;databaseName=PuntoStock_qa_00000000000000000000000000000002;encrypt=true;trustServerCertificate=true
      SQL_TEST_USER: sa
      SQL_TEST_PASSWORD: Only-CI-Disposable-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preparar base desechable
        run: |
          for intento in $(seq 1 40); do
            if docker exec '${{ job.services.sql.id }}' /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_TEST_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec '${{ job.services.sql.id }}' /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_TEST_PASSWORD" -C -b -Q "CREATE DATABASE [PuntoStock_qa_00000000000000000000000000000001]; CREATE DATABASE [PuntoStock_qa_00000000000000000000000000000002]"
      - run: mvn -B spotless:check verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run format:check && npm run lint && npm test
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: .cache/playwright-results
