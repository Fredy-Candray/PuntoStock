logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PuntoStock;encrypt=true;trustServerCertificate=false}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false
app:
  session:
    secure: ${SESSION_SECURE:true}
  recovery:
    enabled: ${RECOVERY_ENABLED:false}
    from: ${MAIL_USERNAME:}
    base-url: ${APP_PUBLIC_URL:http://127.0.0.1:14200}
  jwt-secret: ${JWT_SECRET}
  bootstrap-user: ${BOOTSTRAP_USER:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
