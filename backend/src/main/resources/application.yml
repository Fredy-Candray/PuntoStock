spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PuntoStock;encrypt=true;trustServerCertificate=false}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  jwt-secret: ${JWT_SECRET}
  bootstrap-user: ${BOOTSTRAP_USER:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
